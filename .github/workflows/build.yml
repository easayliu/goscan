name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

# 设置工作流权限
permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: '1.24.3'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Install dependencies
      run: go mod download
    
    - name: Format check
      run: |
        go fmt ./...
        if [ -n "$(git diff --name-only)" ]; then
          echo "Code is not formatted properly"
          exit 1
        fi
    
    - name: Lint
      run: go vet ./...
    
    - name: Generate Swagger docs
      run: |
        go install github.com/swaggo/swag/cmd/swag@latest
        swag init -g cmd/server/main.go --output docs
    
    - name: Run tests
      run: |
        go test -v ./internal/...
        go test -v ./pkg/...

  build-check:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Install dependencies
      run: go mod download
    
    - name: Generate Swagger docs
      run: |
        go install github.com/swaggo/swag/cmd/swag@latest
        swag init -g cmd/server/main.go --output docs
    
    # 和 Dockerfile 一致：CGO_ENABLED=0 的静态二进制
    - name: Build binary (Linux amd64)
      env:
        GOOS: linux
        GOARCH: amd64
        CGO_ENABLED: 0
      run: |
        go build -ldflags "-s -w" -o goscan ./cmd/server
        echo "✅ Build successful for linux/amd64"

    # 部署用的两条命令都不连库，CI 里跑一遍就能挡住「示例配置校验不过」
    # 和「建表语句渲染不出来」这两类问题
    - name: Check sample config and DDL
      run: |
        ./goscan --check configs/config.daemon.yaml
        ./goscan --ddl configs/config.daemon.yaml | grep -q "CREATE TABLE IF NOT EXISTS"
        CLICKHOUSE_CLUSTER=bj_ck ./goscan --ddl configs/config.daemon.yaml | grep -q "ENGINE = Distributed"