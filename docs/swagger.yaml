basePath: /
definitions:
  models.AppConfig:
    properties:
      log_file:
        type: string
      log_level:
        example: info
        type: string
    type: object
  models.ClickHouseConfig:
    properties:
      cluster:
        example: my_cluster
        type: string
      database:
        example: default
        type: string
      hosts:
        example:
        - localhost
        items:
          type: string
        type: array
      port:
        example: 9000
        type: integer
      protocol:
        example: native
        type: string
      username:
        example: default
        type: string
    type: object
  models.CloudProviderConfig:
    properties:
      alicloud:
        $ref: '#/definitions/pkg_models.ProviderConfig'
      aws:
        $ref: '#/definitions/pkg_models.ProviderConfig'
      azure:
        $ref: '#/definitions/pkg_models.ProviderConfig'
      gcp:
        $ref: '#/definitions/pkg_models.ProviderConfig'
      volcengine:
        $ref: '#/definitions/pkg_models.ProviderConfig'
    type: object
  models.ConfigResponse:
    properties:
      app:
        $ref: '#/definitions/models.AppConfig'
      clickhouse:
        $ref: '#/definitions/models.ClickHouseConfig'
      cloud_providers:
        $ref: '#/definitions/models.CloudProviderConfig'
    type: object
  models.ErrorResponse:
    properties:
      code:
        example: 400
        type: integer
      details:
        example: Provider field cannot be empty
        type: string
      error:
        example: true
        type: boolean
      message:
        example: Parameter validation failed
        type: string
    type: object
  models.HealthCheckResponse:
    properties:
      checks:
        additionalProperties: true
        type: object
      status:
        example: healthy
        type: string
      timestamp:
        example: "2025-09-11T08:13:24Z"
        type: string
    type: object
  models.JobListResponse:
    properties:
      count:
        example: 3
        type: integer
      jobs:
        items:
          $ref: '#/definitions/models.JobResponse'
        type: array
    type: object
  models.JobRequest:
    properties:
      cron_expr:
        example: 0 2 * * *
        type: string
      description:
        example: Daily VolcEngine billing sync at 2 AM
        type: string
      enabled:
        example: true
        type: boolean
      name:
        example: daily_volcengine_sync
        type: string
      parameters:
        additionalProperties: true
        type: object
      provider:
        example: volcengine
        type: string
      task_type:
        example: sync
        type: string
    required:
    - cron_expr
    - name
    - provider
    - task_type
    type: object
  models.JobResponse:
    properties:
      created_at:
        example: "2025-09-11T08:13:24Z"
        type: string
      cron_expr:
        example: 0 2 * * *
        type: string
      description:
        example: Daily VolcEngine billing sync at 2 AM
        type: string
      enabled:
        example: true
        type: boolean
      id:
        example: job_123456
        type: string
      last_run:
        example: "2025-09-11T02:00:00Z"
        type: string
      name:
        example: daily_volcengine_sync
        type: string
      next_run:
        example: "2025-09-12T02:00:00Z"
        type: string
      parameters:
        additionalProperties: true
        type: object
      provider:
        example: volcengine
        type: string
      task_type:
        example: sync
        type: string
      updated_at:
        example: "2025-09-11T08:13:24Z"
        type: string
    type: object
  models.MessageResponse:
    properties:
      message:
        example: Operation successful
        type: string
      success:
        example: true
        type: boolean
    type: object
  models.SchedulerMetricsResponse:
    properties:
      active_jobs:
        example: 8
        type: integer
      inactive_jobs:
        example: 2
        type: integer
      scheduler_status:
        $ref: '#/definitions/models.SchedulerStatus'
      timestamp:
        example: "2025-09-11T08:13:24Z"
        type: string
      total_jobs:
        example: 10
        type: integer
      uptime:
        example: 3h45m
        type: string
    type: object
  models.SchedulerStatus:
    properties:
      entries:
        example: 3
        type: integer
      job_count:
        example: 3
        type: integer
      running:
        example: true
        type: boolean
      timestamp:
        example: "2025-09-11T08:13:24Z"
        type: string
    type: object
  models.SyncHistoryEntry:
    properties:
      bill_period:
        example: 2025-09
        type: string
      completed_at:
        example: "2025-09-11T08:15:29Z"
        type: string
      duration:
        example: 125
        type: integer
      error_count:
        example: 0
        type: integer
      id:
        example: sync_123456
        type: string
      message:
        example: Sync completed
        type: string
      provider:
        example: volcengine
        type: string
      record_count:
        example: 1500
        type: integer
      started_at:
        example: "2025-09-11T08:13:24Z"
        type: string
      status:
        example: completed
        type: string
    type: object
  models.SyncHistoryResponse:
    properties:
      count:
        example: 10
        type: integer
      history:
        items:
          $ref: '#/definitions/models.SyncHistoryEntry'
        type: array
    type: object
  models.SyncStatusResponse:
    properties:
      completed_at:
        type: string
      error_count:
        example: 0
        type: integer
      message:
        example: Syncing in progress...
        type: string
      progress:
        example: 75.5
        type: number
      provider:
        example: volcengine
        type: string
      record_count:
        example: 1500
        type: integer
      started_at:
        example: "2025-09-11T08:13:24Z"
        type: string
      status:
        example: running
        type: string
    type: object
  models.SyncTriggerRequest:
    properties:
      bill_period:
        description: |-
          A single billing period. The format also picks the granularity when the
          field above is empty: YYYY-MM is monthly, YYYY-MM-DD is one day.
        example: 2026-09
        type: string
      create_table:
        description: Create the target tables first if they are missing.
        example: false
        type: boolean
      end_period:
        description: End of the inclusive period range.
        example: 2026-06
        type: string
      force_update:
        description: Re-fetch periods that already have data instead of skipping them.
        example: false
        type: boolean
      granularity:
        description: |-
          AliCloud only, selects the target table: monthly writes alicloud_bill_monthly,
          daily writes alicloud_bill_daily, both writes each in one run. Ignored for
          VolcEngine, whose bills land in the single volcengine_bill table.
        enum:
        - monthly
        - daily
        - both
        example: both
        type: string
      limit:
        description: Cap on records to sync; 0 means no cap.
        example: 0
        type: integer
      provider:
        description: Which cloud to sync. Required.
        enum:
        - volcengine
        - alicloud
        example: alicloud
        type: string
      start_period:
        description: |-
          Start of an inclusive period range, used instead of bill_period to backfill
          several periods in one task.
        example: 2026-01
        type: string
      sync_mode:
        description: |-
          standard fetches every period in full, sync-optimal compares record counts
          and only fills the gap. Empty uses the provider default from the config.
        enum:
        - standard
        - sync-optimal
        example: sync-optimal
        type: string
      use_distributed:
        description: Write through the Distributed table instead of the local one.
        example: false
        type: boolean
    required:
    - provider
    type: object
  models.SyncTriggerResponse:
    properties:
      message:
        example: Sync triggered for provider alicloud
        type: string
      provider:
        example: alicloud
        type: string
      status:
        example: started
        type: string
      task_id:
        example: 6f1c8f0e-6c2a-4a1f-9a4d-1f0b7a2c3d4e
        type: string
      timestamp:
        example: "2026-09-11T08:13:24Z"
        type: string
    type: object
  models.SystemStatus:
    properties:
      scheduler:
        $ref: '#/definitions/models.SchedulerStatus'
      service:
        example: goscan
        type: string
      status:
        example: running
        type: string
      tasks:
        $ref: '#/definitions/models.TasksStatus'
      timestamp:
        example: "2025-09-11T08:13:24Z"
        type: string
      uptime:
        example: 3600
        type: integer
      version:
        example: 1.0.0
        type: string
    type: object
  models.TaskListResponse:
    properties:
      count:
        example: 5
        type: integer
      tasks:
        items:
          $ref: '#/definitions/models.TaskResponse'
        type: array
    type: object
  models.TaskRequest:
    properties:
      description:
        example: Sync VolcEngine billing data
        type: string
      name:
        example: volcengine_sync_task
        type: string
      parameters:
        additionalProperties: true
        type: object
      provider:
        example: volcengine
        type: string
      schedule:
        example: 0 2 * * *
        type: string
      type:
        example: sync
        type: string
    required:
    - name
    - provider
    - type
    type: object
  models.TaskResponse:
    properties:
      completed_at:
        example: "2025-09-11T08:13:30Z"
        type: string
      created_at:
        example: "2025-09-11T08:13:24Z"
        type: string
      description:
        example: Sync VolcEngine billing data
        type: string
      id:
        example: task_123456
        type: string
      name:
        example: volcengine_sync_task
        type: string
      parameters:
        additionalProperties: true
        type: object
      provider:
        example: volcengine
        type: string
      schedule:
        example: 0 2 * * *
        type: string
      started_at:
        example: "2025-09-11T08:13:24Z"
        type: string
      status:
        example: running
        type: string
      type:
        example: sync
        type: string
      updated_at:
        example: "2025-09-11T08:13:24Z"
        type: string
    type: object
  models.TasksStatus:
    properties:
      running:
        example: 2
        type: integer
      total:
        example: 10
        type: integer
    type: object
  models.WeChatNotificationHistoryEntry:
    properties:
      duration:
        description: Execution duration
        example: 2m6s
        type: string
      end_time:
        description: End time
        example: "2025-09-12T08:15:30Z"
        type: string
      error:
        description: Error message
        example: Connection timeout
        type: string
      id:
        description: Task ID
        example: task_123456
        type: string
      message:
        description: Execution message
        example: Notification sent successfully
        type: string
      records_processed:
        description: Number of records processed
        example: 1500
        type: integer
      start_time:
        description: Start time
        example: "2025-09-12T08:13:24Z"
        type: string
      status:
        description: Execution status
        example: completed
        type: string
    type: object
  models.WeChatNotificationRequest:
    description: WeChat Work cost report notification trigger request, supports specifying
      analysis date, cloud providers and alert threshold
    properties:
      alert_threshold:
        description: 'Cost change alert threshold (percentage), triggers alert when
          cost change exceeds this value, defaults to system configuration value,
          range: 0-100'
        example: 10
        maximum: 100
        minimum: 0
        type: number
      date:
        description: 'Analysis date, format: YYYY-MM-DD, defaults to current date.
          Example: 2025-09-12'
        example: "2025-09-12"
        type: string
      force_notify:
        description: Force send notification, when set to true will send notification
          even if alert threshold is not reached, defaults to false
        example: false
        type: boolean
      providers:
        description: 'List of cloud providers to analyze, supports: volcengine (VolcEngine),
          alicloud (Alibaba Cloud), aws, azure, gcp, defaults to ["volcengine", "alicloud"]'
        example:
        - volcengine
        - alicloud
        items:
          type: string
        type: array
      test_mode:
        description: Test mode, when set to true only tests WeChat Work connection
          without sending actual cost report, defaults to false
        example: false
        type: boolean
    type: object
  models.WeChatNotificationStatusResponse:
    properties:
      alert_threshold:
        description: Alert threshold
        example: 10
        type: number
      enabled:
        description: Whether WeChat notification feature is enabled
        example: true
        type: boolean
      executor_enabled:
        description: Whether executor is enabled
        example: true
        type: boolean
      executor_status:
        description: Executor status
        example: ready
        type: string
      history_count:
        description: Number of history records
        example: 5
        type: integer
      max_retries:
        description: Maximum retry attempts
        example: 3
        type: integer
      mention_users:
        description: List of users to mention
        example:
        - user1
        - user2
        items:
          type: string
        type: array
      recent_history:
        description: Recent notification history
        items:
          $ref: '#/definitions/models.WeChatNotificationHistoryEntry'
        type: array
      retry_delay:
        description: Retry delay time (seconds)
        example: 5
        type: integer
      timestamp:
        description: Status query timestamp
        example: "2025-09-12T08:13:24Z"
        type: string
      webhook_configured:
        description: Whether Webhook is configured
        example: true
        type: boolean
      webhook_url:
        description: Masked Webhook URL
        example: https://qyapi***webhook
        type: string
    type: object
  models.WeChatTestRequest:
    description: WeChat Work Webhook connection test request, used to verify Webhook
      URL availability
    properties:
      custom_message:
        description: Custom test message content, maximum length 500 characters, defaults
          to system preset test message
        example: This is a test message from cost monitoring system
        maxLength: 500
        type: string
      timeout:
        description: Connection timeout (seconds), range 1-60 seconds, defaults to
          10 seconds
        example: 10
        maximum: 60
        minimum: 1
        type: integer
    type: object
  pkg_models.ProviderConfig:
    properties:
      enabled:
        example: true
        type: boolean
      endpoint:
        example: ecs.cn-hangzhou.aliyuncs.com
        type: string
      has_credentials:
        description: 'Note: AccessKey and SecretKey are masked for security'
        example: true
        type: boolean
      host:
        example: billing.volcengineapi.com
        type: string
      region:
        example: cn-north-1
        type: string
      timeout:
        example: 30
        type: integer
    type: object
  tasks.Task:
    properties:
      cancel_requested:
        description: |-
          CancelRequested is set once someone has asked the task to stop. It keeps
          running until the pass in flight is written, then ends as cancelled —
          or as completed, if that pass was its last.
        type: boolean
      config:
        $ref: '#/definitions/tasks.TaskConfig'
      duration:
        description: nanoseconds, as time.Duration encodes
        example: 1500000000
        type: integer
      end_time:
        type: string
      error:
        type: string
      id:
        type: string
      progress:
        allOf:
        - $ref: '#/definitions/tasks.TaskProgress'
        description: |-
          Progress is where a running sync has got to; absent until the sync first
          reports. It is replaced wholesale on every update and never edited in
          place, which is what lets a shallow copy of the task be read after the
          manager's lock is gone.
      provider:
        type: string
      result:
        $ref: '#/definitions/tasks.TaskResult'
      start_time:
        type: string
      status:
        $ref: '#/definitions/tasks.TaskStatus'
      type:
        $ref: '#/definitions/tasks.TaskType'
    type: object
  tasks.TaskConfig:
    properties:
      bill_period:
        type: string
      create_table:
        type: boolean
      end_period:
        type: string
      force_update:
        type: boolean
      granularity:
        description: For AliCloud
        type: string
      limit:
        type: integer
      start_period:
        type: string
      sync_mode:
        type: string
      use_distributed:
        type: boolean
    type: object
  tasks.TaskProgress:
    properties:
      done:
        type: integer
      granularity:
        description: |-
          Granularity names the table that period is going into ("monthly" or
          "daily"). A run over both visits every period twice, so without it the
          bar looks like it is repeating itself.
        type: string
      period:
        type: string
      records:
        description: |-
          Records is how many rows of the period in flight are written so far and
          RecordsTotal how many the API said it holds; 0 when that is not known up
          front (a whole cycle at daily granularity is fetched one day at a time).
          A single period can take minutes, and these are what move meanwhile.
        type: integer
      records_total:
        type: integer
      total:
        type: integer
      updated_at:
        type: string
    type: object
  tasks.TaskResult:
    properties:
      completed_at:
        type: string
      duration:
        description: nanoseconds
        example: 1500000000
        type: integer
      error:
        type: string
      id:
        type: string
      message:
        type: string
      not_run:
        description: |-
          NotRun names the passes a cancelled sync never started, e.g.
          "2026-04 daily". Their tables were left exactly as they were.
        items:
          type: string
        type: array
      records_fetched:
        type: integer
      records_processed:
        type: integer
      started_at:
        type: string
      status:
        type: string
      success:
        type: boolean
      type:
        type: string
    type: object
  tasks.TaskStatus:
    enum:
    - pending
    - running
    - completed
    - failed
    - cancelled
    type: string
    x-enum-varnames:
    - TaskStatusPending
    - TaskStatusRunning
    - TaskStatusCompleted
    - TaskStatusFailed
    - TaskStatusCancelled
  tasks.TaskType:
    enum:
    - sync
    - notification
    type: string
    x-enum-varnames:
    - TaskTypeSync
    - TaskTypeNotification
host: localhost:8080
info:
  contact:
    email: support@goscan.com
    name: API Support
  description: |-
    Cloud billing data synchronization service API documentation
    Supports automatic synchronization of billing data from multi-cloud platforms like VolcEngine and Alibaba Cloud to ClickHouse database
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Goscan API
  version: "1.0"
paths:
  /health:
    get:
      consumes:
      - application/json
      description: 'Perform comprehensive system health check including database connection,
        task manager status, etc. (Note: this endpoint is not under /api/v1 path)'
      produces:
      - application/json
      responses:
        "200":
          description: Health check passed
          schema:
            $ref: '#/definitions/models.HealthCheckResponse'
        "503":
          description: Service unhealthy
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Perform health check
      tags:
      - Health Check
  /notifications/wechat:
    post:
      consumes:
      - application/json
      description: |-
        Manually trigger WeChat Enterprise cost report notification, supports specifying analysis date, cloud provider list and alert threshold. Can be used for temporary notification needs outside of scheduled tasks.

        **Request Example:**
        ```json
        {
        "date": "2025-09-12",
        "providers": ["volcengine", "alicloud"],
        "alert_threshold": 15.0,
        "force_notify": false,
        "test_mode": false
        }
        ```

        **Field Descriptions:**
        - `date`: Analysis date, format YYYY-MM-DD, uses current date if not provided
        - `providers`: Cloud provider list, supports volcengine/alicloud/aws/azure/gcp
        - `alert_threshold`: Cost change alert threshold (percentage), range 0-100
        - `force_notify`: Whether to force send, ignores alert threshold when true
        - `test_mode`: Test mode, only tests connection without sending actual report when true
      parameters:
      - description: WeChat notification trigger request parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.WeChatNotificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Triggered successfully
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: Invalid request parameters or WeChat notification not enabled
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Manually trigger WeChat Enterprise notification
      tags:
      - Notification Management
  /notifications/wechat/status:
    get:
      consumes:
      - application/json
      description: Returns detailed information about WeChat Enterprise notification
        feature configuration status, connection status, recent notification history,
        etc.
      parameters:
      - default: 10
        description: History record count limit
        in: query
        maximum: 50
        minimum: 1
        name: history_limit
        type: integer
      - default: true
        description: Whether to include detailed configuration
        in: query
        name: include_config
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Status information retrieved successfully
          schema:
            $ref: '#/definitions/models.WeChatNotificationStatusResponse'
      summary: Get WeChat Enterprise notification status
      tags:
      - Notification Management
  /notifications/wechat/test:
    post:
      consumes:
      - application/json
      description: Send test message to WeChat Enterprise group to verify correctness
        and connectivity of Webhook URL configuration, will not send actual cost reports
      parameters:
      - description: Test request parameters (optional)
        in: body
        name: request
        schema:
          $ref: '#/definitions/models.WeChatTestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Connection test successful
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: WeChat notification not enabled or Webhook URL not configured
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Connection test failed or internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Test WeChat Enterprise Webhook connection
      tags:
      - Notification Management
  /scheduler/jobs:
    get:
      consumes:
      - application/json
      description: Returns information of all configured scheduled jobs
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JobListResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get scheduled job list
      tags:
      - Schedule Management
    post:
      consumes:
      - application/json
      description: Create a new scheduled sync job
      parameters:
      - description: Scheduled job request parameters
        in: body
        name: job
        required: true
        schema:
          $ref: '#/definitions/models.JobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Create scheduled job
      tags:
      - Schedule Management
  /scheduler/jobs/{id}:
    delete:
      consumes:
      - application/json
      description: Delete specified scheduled job
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Delete scheduled job
      tags:
      - Schedule Management
    get:
      consumes:
      - application/json
      description: Returns detailed information of scheduled job by job ID
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get specific scheduled job
      tags:
      - Schedule Management
    put:
      consumes:
      - application/json
      description: Update scheduled job configuration for specified ID
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      - description: Scheduled job update parameters
        in: body
        name: job
        required: true
        schema:
          $ref: '#/definitions/models.JobRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Update scheduled job
      tags:
      - Schedule Management
  /scheduler/jobs/{id}/trigger:
    post:
      consumes:
      - application/json
      description: Immediately execute specified scheduled job without waiting for
        next scheduled time
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Manually trigger scheduled job
      tags:
      - Schedule Management
  /scheduler/metrics:
    get:
      consumes:
      - application/json
      description: Returns performance metrics information of scheduler, including
        task execution statistics, success rate, etc.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SchedulerMetricsResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get scheduler performance metrics
      tags:
      - Schedule Management
  /scheduler/status:
    get:
      consumes:
      - application/json
      description: Returns running status information of the task scheduler
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SchedulerStatus'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get scheduler status
      tags:
      - Schedule Management
  /sync:
    get:
      consumes:
      - application/json
      description: Returns summary status information of all current data sync tasks,
        including running task count, total task count and other statistics
      produces:
      - application/json
      responses:
        "200":
          description: Sync status retrieved successfully
          schema:
            $ref: '#/definitions/models.SyncStatusResponse'
      summary: Get data sync status
      tags:
      - Data Sync
    post:
      consumes:
      - application/json
      description: |-
        Immediately trigger billing data sync operation for specified cloud provider. Supports multiple cloud providers like Volcengine, Alibaba Cloud, etc.
        Supports configuring sync mode, time range, granularity and other parameters.
        For AliCloud the granularity field picks the target table: monthly writes alicloud_bill_monthly, daily writes alicloud_bill_daily, both writes each. When it is empty the bill_period format decides instead (YYYY-MM monthly, YYYY-MM-DD daily). VolcEngine has a single table and ignores granularity.
        The endpoint returns as soon as the task is registered; poll GET /tasks/{task_id} for the outcome.
      parameters:
      - description: Sync request parameters including cloud provider, sync mode,
          billing period range and other configurations
        in: body
        name: sync
        required: true
        schema:
          $ref: '#/definitions/models.SyncTriggerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Sync task accepted, poll the returned task_id
          schema:
            $ref: '#/definitions/models.SyncTriggerResponse'
        "400":
          description: Invalid request parameters or missing cloud provider configuration
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: A sync for this provider is already running
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: Too many tasks in flight, retry later
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "503":
          description: Shutting down, no new tasks are taken; retry later
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Manually trigger billing data sync
      tags:
      - Data Sync
  /sync/history:
    get:
      consumes:
      - application/json
      description: Returns execution records of historical sync tasks, including successful
        and failed tasks, as well as detailed information of each sync
      parameters:
      - default: 100
        description: Limit of returned records
        in: query
        maximum: 1000
        minimum: 1
        name: limit
        type: integer
      - description: Filter records by specified cloud provider
        enum:
        - volcengine
        - alicloud
        - aws
        - azure
        - gcp
        in: query
        name: provider
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: History records retrieved successfully
          schema:
            $ref: '#/definitions/models.SyncHistoryResponse'
      summary: Get sync history records
      tags:
      - Data Sync
  /system/config:
    get:
      consumes:
      - application/json
      description: Returns system configuration information with sensitive data masked
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ConfigResponse'
      summary: Get system configuration
      tags:
      - System Management
    put:
      consumes:
      - application/json
      description: This endpoint does not support configuration updates for security
        reasons
      produces:
      - application/json
      responses:
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Update system configuration
      tags:
      - System Management
  /system/status:
    get:
      consumes:
      - application/json
      description: Returns system information including service running status, task
        statistics and scheduler status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SystemStatus'
      summary: Get system status
      tags:
      - System Management
  /tasks:
    get:
      consumes:
      - application/json
      description: Returns detailed information of all tasks in the system, including
        running, completed and failed tasks
      produces:
      - application/json
      responses:
        "200":
          description: Task list retrieved successfully
          schema:
            $ref: '#/definitions/models.TaskListResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get all task list
      tags:
      - Task Management
    post:
      consumes:
      - application/json
      description: Create and asynchronously execute a new cloud provider billing
        data sync task. Supports multiple cloud providers like Volcengine, Alibaba
        Cloud, etc.
      parameters:
      - description: Task request parameters including task type, cloud provider,
          sync configuration, etc.
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/models.TaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Task created successfully
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Create new sync task
      tags:
      - Task Management
  /tasks/{id}:
    delete:
      description: |-
        Asks the sync to stop after the pass (one period × one granularity) it is on. The answer comes at once, with 202: the task keeps running until that pass is written, meanwhile carrying cancel_requested=true, and then ends as cancelled — or as completed, if that pass was its last. Watch it on GET /tasks/{id}/events.
        Passes that never started are listed in result.not_run and their data is untouched; no period is ever left half written. Asking again while it stops is fine.
      parameters:
      - description: Task ID returned by POST /sync
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Stop requested
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Task has already finished, or is not a sync
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Stop a running sync
      tags:
      - Task Management
    get:
      consumes:
      - application/json
      description: Get detailed information of a specific task by task ID, including
        task status, execution progress, error information, etc.
      parameters:
      - description: Unique task identifier ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Task details retrieved successfully
          schema:
            $ref: '#/definitions/tasks.Task'
        "400":
          description: Invalid task ID
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get specific task details
      tags:
      - Task Management
  /tasks/{id}/events:
    get:
      description: |-
        Pushes the task's state every time it changes, as `event: task` with the same JSON GET /tasks/{id} returns. The first event is the current state; when the task completes, fails or is cancelled the last `task` event is followed by `event: done` and the stream closes.
        Use it from a browser with `new EventSource('/tasks/{id}/events')` and call `close()` on `done` — otherwise EventSource reconnects by itself, gets the finished task once more and is closed again, every few seconds.
      parameters:
      - description: Task ID returned by POST /sync
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'event: task — one per change'
          schema:
            $ref: '#/definitions/tasks.Task'
        "404":
          description: Task not found (not active and not among the last 100 finished)
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Stream a task's progress (Server-Sent Events)
      tags:
      - Task Management
  /tasks/events:
    get:
      description: 'Pushes `event: task` for every active task on connect, then one
        each time any task changes — manual syncs, scheduled ones and notifications
        alike. The stream stays open; a task whose status is completed, failed or
        cancelled has finished.'
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'event: task — one per change of any task'
          schema:
            $ref: '#/definitions/tasks.Task'
      summary: Stream all tasks' progress (Server-Sent Events)
      tags:
      - Task Management
schemes:
- http
- https
swagger: "2.0"
