# goscan 配置样例。K8s 上的那份在 deploy/goscan-deployment.yaml 的 ConfigMap 里，
# 结构完全一样。
#
#   goscan --check configs/config.daemon.yaml   # 只校验，不连库
#   goscan --ddl   configs/config.daemon.yaml   # 打印建表语句，不连库
#   goscan         configs/config.daemon.yaml   # 启动（内置 cron + HTTP API）
#
# 每一项都能用环境变量覆盖（CLICKHOUSE_* / VOLCENGINE_* / ALICLOUD_* / WECHAT_*），
# 所以密钥不用写进这个文件，容器里由 Secret 注入即可。

clickhouse:
  hosts:
    - localhost
  port: 9000 # native 协议端口；protocol 改成 http 时用 8123
  database: default # 和 log / trace / metric 同库时填 logs
  username: default
  password: ""
  debug: false
  protocol: "native" # native 或 http
  # ClickHouse 集群名（system.clusters 里的那个，不是 k8s 集群）。填了之后
  # `--ddl` 建的是「<表名>_local 存数据 + <表名> 这张 Distributed」两张，写入和查询
  # 都走 Distributed 表，也就是配置里写的这个名字（口径同 logpipe / tracepipe）。
  cluster: ""
  # 集群里的本地表用 Replicated* 引擎，需要 ClickHouse Keeper / ZooKeeper。
  # 集群是一堆无副本分片时保持 false。
  replicated: false

server:
  port: 8080
  address: "0.0.0.0"

# 内置 cron 调度。K8s 上也是这一套：一个常驻 Deployment 自己按点跑，
# 不用 CronJob。改了这里 Pod 重启后生效。
scheduler:
  enabled: true
  jobs:
    # 火山云每日同步
    - name: "volcengine_daily_sync"
      provider: "volcengine"
      cron: "0 2 * * *"
      config:
        sync_mode: "sync-optimal" # standard | sync-optimal
        use_distributed: false
        force_update: true

    # 阿里云每日同步
    - name: "alicloud_daily_sync"
      provider: "alicloud"
      cron: "0 3 * * *"
      config:
        sync_mode: "sync-optimal"
        use_distributed: false
        force_update: true
        granularity: "both" # monthly | daily | both

    # 企业微信费用日报
    - name: "daily_cost_report_notification"
      provider: "notification"
      cron: "30 8 * * *"
      config:
        sync_mode: "cost_report"

runtime:
  max_concurrent_tasks: 3
  task_timeout: 3600 # 单个任务超时（秒）
  graceful_shutdown_timeout: 30 # 优雅关闭超时（秒）

# 多云服务商配置。凭据全空的块视为「这朵云没接」，--check 会跳过它；
# 只填一半（有 access_key 没有 secret_key）才会报错。
cloud_providers:
  volcengine:
    access_key: "" # 建议走 VOLCENGINE_ACCESS_KEY 环境变量
    secret_key: "" # 建议走 VOLCENGINE_SECRET_KEY 环境变量
    region: "cn-north-1"
    host: "billing.volcengineapi.com"
    timeout: 30
    batch_size: 50
    max_retries: 5
    retry_delay: 3
    bill_table: "volcengine_bill"
    default_sync_mode: "all_periods"
    max_historical_months: 12
    auto_detect_periods: true
    skip_empty_periods: true

  alicloud:
    access_key_id: "" # 建议走 ALICLOUD_ACCESS_KEY_ID 环境变量
    access_key_secret: "" # 建议走 ALICLOUD_ACCESS_KEY_SECRET 环境变量
    region: "cn-hangzhou"
    endpoint: ""
    timeout: 30
    batch_size: 100
    max_retries: 5
    retry_delay: 2
    default_granularity: "monthly"
    enable_daily_sync: false
    daily_sync_days: 30
    monthly_table: "alicloud_bill_monthly"
    daily_table: "alicloud_bill_daily"
    default_sync_mode: "all_periods"
    max_historical_months: 18
    auto_detect_periods: true
    skip_empty_periods: true

  # 以下三朵云还没接，留着占位
  aws:
    access_key: ""
    secret_key: ""
    region: "us-east-1"
    timeout: 30

  azure:
    client_id: ""
    client_secret: ""
    tenant_id: ""
    subscription_id: ""
    timeout: 30

  gcp:
    project_id: ""
    service_account_key: ""
    timeout: 30

# 企业微信通知
wechat:
  webhook_url: "" # 建议走 WECHAT_WEBHOOK_URL 环境变量
  enabled: false
  mention_users: []
  alert_threshold: 20.0 # 费用变化超过这个百分比就告警
  max_retries: 3
  retry_delay: 2
  notification_format: "auto" # markdown | template_card | auto
  # 以图片形式发送报告，能带上完整的产品明细
  send_as_image: false
  image_config:
    width: 1200
    chart_height: 300
    show_all_products: true
    include_charts: true
    font_size: 14
    title_font_size: 20
    table_font_size: 12
    max_size_mb: 2.0

app:
  environment: production
  log_level: info
  # 留空就只打到 stdout，容器里交给 logpipe 采走
  log_file: ""
